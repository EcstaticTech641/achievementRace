# ==============================================================================
#                 Ronlab Companion Minigame: Achievement Race
#                            Configuration Schema
# ==============================================================================
#
# CPMK ARCHITECTURAL COMPLIANCE & SPECIFICATION STANDARD:
# Primary Engine: RonlabGameAssistant (rga-core) / rga-api (1.13.0)
# Target Environment: Java 25 / PaperMC 26.2
# Companion Plugin ID: ronlab:achievementrace
#
# ------------------------------------------------------------------------------
# SOLO QA DEVELOPER MODE (initialPlayerCount == 1)
# ------------------------------------------------------------------------------
# When a match is initiated with a single player (initialPlayerCount == 1),
# the CPMK Solo QA Developer Mode is automatically activated:
#  - Automatic win conditions (target-score threshold check) freeze and are
#    suppressed upon reaching the goal.
#  - Log notifications and in-game light purple broadcast messages notify the tester
#    [QA Guard] that target score has been reached.
#  - The match remains active continuously to allow developers and QA testers to
#    validate objective rotation engines, advancement completions, HUD updates,
#    map resets, and mechanics without forced session eviction.
# ==============================================================================

# ------------------------------------------------------------------------------
# Game Rules & Session Settings
# ------------------------------------------------------------------------------

# Gamemode Selection:
#  - RACE : First player or team to hit 'target-score' completed advancements wins immediately.
#  - HUNT : Timed match where players accumulate points until 'match-duration-seconds' expires.
mode: RACE

# Target Score:
# The total number of valid advancement points required to win in RACE mode.
# Default: 5
target-score: 5

# Match Duration (Seconds):
# Duration of the countdown timer for HUNT mode or timed RACE sessions.
# Default: 300 (5 minutes). Set to 0 to disable timer.
match-duration-seconds: 300

# ------------------------------------------------------------------------------
# Arena Spawns & World Boundaries (Template World Specification)
# ------------------------------------------------------------------------------
# Spawn vectors, pedestal locations, and fall Y-thresholds are provisioned
# by rga-core via the session template world (e.g. "turfwars").
#  - Default Spawn Vector: (X: 0.5, Y: 64.0, Z: 0.5, Pitch: 0.0, Yaw: 0.0)
#  - Pedestal Platform Coordinates: World spawn platform
#  - Void Fall Threshold Y-Level: Y = -64 (Teleports to spawn or transitions to spectator)

# ------------------------------------------------------------------------------
# Advancement Blacklist
# ------------------------------------------------------------------------------
# List of Minecraft advancement keys excluded from the active objective pool.
# Advancements listed here will never be assigned to players.
# Namespace defaults to 'minecraft:' if omitted.
blacklist:
  - "minecraft:adventure/avoid_vibration"
  - "minecraft:nether/all_potions"
  - "minecraft:nether/create_beacon"
  - "minecraft:nether/all_effects"
  - "minecraft:husbandry/complete_catalogue"
  - "minecraft:husbandry/allay_deliver_cake_to_note_block"
